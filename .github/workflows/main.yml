name: GeoMetrics Build

on: push

jobs:
  UnitTests:
    name: Unit Test Build Action
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 23
        uses: actions/setup-java@v5
        with:
          java-version: '23'
          distribution: 'temurin'
      - name: Unit Tests
        run: mvn -Dtest='com.napier.sem.services.CapitalCityServiceTest,com.napier.sem.services.LanguageReportServiceTest,com.napier.sem.services.PopulationDistributionServiceTest,com.napier.sem.services.PopulationServiceTest,com.napier.sem.services.CityReportServiceTest,com.napier.sem.services.CountryServiceTest,com.napier.sem.reports.ReportFormatterTests' test
      - name: List dirs
        run: |
          cd ./target/site/jacoco
          pwd
          ls
      - name: CodeCov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  # directory: ./target/site/jacoco
  #  verbose: true # optional (default = false)

  IntegrationTests:
    name: Integration Test Build Action
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 23
        uses: actions/setup-java@v5
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Start MySQL and wait until healthy
        run: docker compose up -d --wait db
      - name: Integration Tests
        env:
          RUN_COUNTRY_INTEGRATION_TESTS: "true"
          RUN_CITY_INTEGRATION_TESTS: "true"
          RUN_CAPITAL_CITY_INTEGRATION_TESTS: "true"
          RUN_LANGUAGE_INTEGRATION_TESTS: "true"
          RUN_POPULATION_INTEGRATION_TESTS: "true"
          RUN_DB_URL_TESTS: "true"
        run: mvn test
      - name: Stop MySQL
        if: always()
        run: docker compose down

      - name: CodeCov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  build:
    name: GeoMetrics build action
    needs: [UnitTests, IntegrationTests]
    runs-on: ubuntu-22.04

    # Build steps
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 23
        uses: actions/setup-java@v5
        with:
          java-version: '23'
          distribution: 'temurin'

      # Start MySQL
      - name: Start MySQL and wait until healthy
        run: docker compose up -d --wait db

      # Build application (tests already run in previous jobs)
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # Run the application
      - name: Run application with MySQL
        run: docker compose up --build --abort-on-container-exit --exit-code-from app

      # Show Docker logs
      - name: View logs
        if: always()
        run: docker compose logs

      # Clean up containers
      - name: Stop containers
        if: always()
        run: docker compose down
