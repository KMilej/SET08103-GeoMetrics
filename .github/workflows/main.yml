name: GeoMetrics Build
on: push

jobs:
  build:
    name: GeoMetrics build action
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 23
        uses: actions/setup-java@v5
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn package

      - name: Run docker compose
        run: APP_MODE=check docker compose up --build --abort-on-container-exit --exit-code-from app

      - name: View logs
        if: always()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down
