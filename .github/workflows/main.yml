name: GeoMetrics Build
on: push

jobs:
  build:
    name: GeoMetrics build action
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 23
        uses: actions/setup-java@v5
        with:
          java-version: '23'
          distribution: 'temurin'
      # Start MySQL before running integration tests
      - name: Start MySQL
        run: docker compose up -d db

      # Wait for the database to become ready
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if docker compose exec -T db mysqladmin ping -h localhost --silent; then
              echo "MySQL is ready"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready"
          exit 1

      - name: Start MySQL for city tests
        run: docker compose up -d --wait db

      - name: Run city report tests
        env:
          RUN_CITY_INTEGRATION_TESTS: "true"
        run: mvn -Dtest=CityReportRepositoryTest,CityReportServiceTest test

      - name: Run Country report tests
        env:
          RUN_COUNTRY_INTEGRATION_TESTS: "true"
        run: mvn -Dtest=CountryRepositoryTest,CountryServiceTest,ContinentTest test

      - name: Build with Maven
        run: mvn package

      - name: Run application with MySQL
        run: docker compose up --build --abort-on-container-exit --exit-code-from app

      - name: View logs
        if: always()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down
