name: GeoMetrics Build
on: push

jobs:
  build:
    name: GeoMetrics build action
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 23
        uses: actions/setup-java@v5
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Setup network
        run: |
          docker network create --driver bridge se-methods
          docker pull mongo
          docker run -d --name mongo-dbserver --network se-methods mongo

      - name: Build with Maven
        run: mvn package

      - name: Build
        run: docker build -t geometrics .

      - name: Run image
        run: docker run --network se-methods --name geometrics-container geometrics

      - name: View logs
        run: docker logs geometrics-container
