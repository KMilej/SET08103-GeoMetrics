name: GeoMetrics Build
on: push

jobs:
  build:
    name: GeoMetrics build action
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 23
        uses: actions/setup-java@v5
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Compile with Maven
        run: mvn compile

      - name: Build Docker Image
        run: docker build -t geometrics .

      - name: Run image
        run: docker run --name geometrics-container -d geometrics

      - name: View logs
        run: docker logs geometrics-container